<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krampus Carol Rehearsal</title>
<style>
:root{--dir:#e6cf8b;--bg:#14161c;--panel:#1d2029;--ink:#e8e8ee;--dim:#8d93a6;--gold:#ffc83d;--line:#2b2f3b;--hl:#2a3350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#bar{position:sticky;top:0;z-index:10;background:#0e1015;border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
#ctl{position:fixed;left:0;right:0;bottom:0;z-index:12;background:#0e1015;border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.row1{display:flex;gap:8px;align-items:center;max-width:860px;margin:0 auto}
.row1 button{min-width:46px;min-height:44px;font-size:18px}
.row1 #bPlay{flex:1;max-width:220px}
.row1 #bMenu{margin-left:auto;display:flex;align-items:center;justify-content:center}
.row1 #bMenu svg{width:24px;height:24px}
@media (max-width:420px){.row1 button{min-width:44px}}
#chap{display:block;width:100%;max-width:860px;margin:0 auto;font-size:15px;padding:8px 10px;background:var(--panel)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.mute{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;min-height:28px;border-radius:6px;background:transparent;border:1px solid var(--line);color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.06em}
.mute svg{width:16px;height:16px}
.mute.on{border-color:var(--gold);color:var(--gold)}
.mute.eye.on{border-color:#8fb7d8;color:#8fb7d8}
.blurred .txt{filter:blur(7px);user-select:none;transition:filter .15s}
.blurred.peek .txt{filter:none}
.blurred .first{display:none!important}
.act.scene{font-size:12px;color:var(--dim);letter-spacing:.14em;margin-top:18px}
#drawer{position:fixed;inset:0;z-index:30;background:#0008;display:flex;justify-content:flex-end}
#drawer[hidden]{display:none}
#drawer .sheet{width:min(520px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) 40px 16px}
.dhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-12px;background:var(--bg);padding:6px 0;z-index:1}
.dhead b{font-size:18px}
#drawer section{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:10px}
#drawer h4{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hint{margin:0;font-size:13px;color:var(--dim)}
#drawer label.s{font-size:15px;justify-content:space-between}
#drawer input[type=range]{width:55%}
#drawer select{width:100%}
#tapBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:25;font-size:22px;padding:18px 40px;border-radius:999px}
#tapBtn[hidden]{display:none}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:#566}
button.pri{background:var(--gold);color:#222;border-color:var(--gold);font-weight:700}
label.s{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:14px}
input[type=range]{padding:0;width:90px}
main{max-width:860px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 140px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:600px){.item{padding:8px 8px}.mine .txt{font-size:19px}.blk label{width:100%}}
@media (hover:hover){.item:hover{background:#191c25}}
.page{margin:26px 0 8px;color:var(--dim);font-size:13px;letter-spacing:.12em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:6px}
.item{padding:8px 12px;border-radius:10px;margin:3px 0;border:1px solid transparent;cursor:pointer}
.item.active{background:var(--hl);border-color:#4a5a99}
.item.next{outline:2px dashed var(--gold)}
.who{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.who i{font-weight:400;text-transform:none;letter-spacing:0}
.item.dir{margin:10px 0}
.dir .dir{color:var(--dir);font-style:italic;font-size:15px;text-align:center;max-width:34em;margin:0 auto;padding:4px 10px;border-top:1px dashed #4a4130;border-bottom:1px dashed #4a4130}
.act{margin:28px 0 8px;text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.lyric .txt{font-weight:600;letter-spacing:.02em}
.lyric.other{opacity:.6}
.mine{border-left:4px solid var(--gold);background:#221f12}
.mine .who{color:var(--gold)}
.mine .txt{font-size:20px}
.cue{color:#7f8aa3;font-size:12px;font-weight:600;letter-spacing:.08em}
.item.cue{padding-top:2px;padding-bottom:2px}
.cue .nofile{color:var(--dim);font-weight:400}
.gap{color:#e07070;font-size:14px;font-style:italic}
.flag{color:#e0a050;font-size:12px}
#cast{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.05em}
.chip.ai{background:var(--panel);color:var(--ink)}
.chip.you{background:var(--gold);color:#222;border-color:var(--gold)}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:14px 0 6px;cursor:default}
.bh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btitle{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:4px 0;color:var(--gold)}
.btitle b{display:block;font-size:17px;letter-spacing:.03em}.btitle small{display:block;color:var(--dim);font-size:12px}
.bplay{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#222;font-size:16px;flex:none}
.vt{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.vt button{border:0;border-radius:0;padding:10px 16px;font-size:15px;font-weight:700;background:var(--bg);color:var(--dim);min-height:44px}
.vt button.on{background:var(--gold);color:#222}
.vt1{margin-left:auto;font-size:13px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.blk .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--dim)}
.blk input[type=number]{width:70px}
.blk select{padding:4px 8px}
.t{margin-left:8px;font-size:12px;color:var(--dim);float:right;display:none}
body.showt .t{display:inline}
.tin{width:70px;padding:2px 4px;font-size:12px}
body.mem-first .mine .txt{display:none}
body.mem-first .mine .first{display:block}
body.mem-hide .mine .txt{filter:blur(9px);user-select:none}
body.mem-hide .mine.peek .txt,body.mem-hide .mine.active.peek .txt{filter:none}
.first{display:none;font-size:20px;color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:90vw;transform:translateX(-50%);background:#000c;border:1px solid #556;padding:8px 14px;border-radius:10px;display:none;z-index:20}
#panel{display:none;padding:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#panel.open{display:block}
.crow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:6px 0;font-size:14px}.crow b{min-width:160px}
#panel input[type=file]{max-width:100%}
kbd{background:#000;border:1px solid #445;border-radius:4px;padding:0 5px;font-size:12px}
</style></head><body>
<header id="bar">
 <select id="chap" aria-label="Go to scene or song"></select>
</header>
<nav id="ctl" aria-label="Playback">
 <div class="row1">
  <button id="bPrev" aria-label="Previous line">⏮</button>
  <button id="bPlay" class="pri">▶ Play</button>
  <button id="bNext" aria-label="Skip">⏭</button>
  <button id="bStop" aria-label="Stop">■</button>
  <button id="bMenu" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
</nav>
<div id="drawer" hidden><div class="sheet">
 <div class="dhead"><b>Settings</b><button id="bClose" class="pri">Done</button></div>
 <section><h4>Practice</h4>
  <select id="mem" title="Memorize mode"><option value="show">My lines: show</option><option value="first">My lines: first words only</option><option value="hide">My lines: hidden (tap to peek)</option></select>
  <label class="s">Move on after my lines automatically <input type="checkbox" id="auto" checked></label>
  <label class="s">Time I get for my lines <input type="range" id="pace" min="0.6" max="1.6" step="0.05" value="1"></label></section>
 <section><h4>Sound</h4>
  <label class="s">Voice volume <input type="range" id="vvol" min="0" max="1" step="0.05" value="1"></label>
  <label class="s">Music volume <input type="range" id="mvol" min="0" max="1" step="0.05" value="0.8"></label>
  <label class="s">AI speaking speed <input type="range" id="rate" min="0.8" max="1.4" step="0.05" value="1"></label>
  <label class="s">Songs play the <select id="ver" style="width:auto"><option value="karaoke">karaoke track</option><option value="demo">demo (with singing)</option></select></label>
  <p class="hint">You can also switch a single song in its ♪ box.</p></section>
 <section><h4>Advanced</h4>
  <button id="bSet">Add your own sound cue files</button>
  <div id="panel"></div></section>
</div></div>
<button id="tapBtn" class="pri" hidden>TAP when the line starts</button>
<main id="list"></main>
<div id="toast"></div>
<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s), ITEMS=KC.items, BLOCKS=KC.blocks, AUD=KC.audio;
let store={cfg:{},blk:{}};
try{store=Object.assign(store,JSON.parse(localStorage.getItem('kc_v1')||'{}'))}catch(e){}
store.cfg=store.cfg||{};store.blk=store.blk||{};
const save=()=>{try{localStorage.setItem('kc_v1',JSON.stringify(store))}catch(e){}};
const blkAt={},blkOf={};
BLOCKS.forEach(b=>{blkAt[b.first]=b;for(let i=b.first;i<=b.last;i++)blkOf[i]=b});
store.cfg.cast=store.cfg.cast||{};
const castOn=w=>store.cfg.cast[w]!=null?store.cfg.cast[w]:w!=='SANTA';
const isMine=it=>!!it.who&&!(it.paren&&/prerecorded/.test(it.paren))&&it.who.some(w=>!castOn(w));
const CHARS=[...new Set(ITEMS.filter(i=>i.who).flatMap(i=>i.who))];
function castUI(){}
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>';
store.cfg.hide=store.cfg.hide||{};const hid=w=>!!store.cfg.hide[w];
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>';
const eyeBtn=w=>hid(w)?`<button class="mute eye on" data-eye="${w}" aria-label="Show ${w}'s lines">${EYE_OFF} HIDDEN</button>`:`<button class="mute eye" data-eye="${w}" aria-label="Hide ${w}'s lines">${EYE}</button>`;
const muteBtn=w=>castOn(w)?`<button class="mute" data-w="${w}" aria-label="Mute ${w}">${ICON_ON}</button>`:`<button class="mute on" data-w="${w}" aria-label="Unmute ${w}">${ICON_OFF} MUTED (rehearsing)</button>`;
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'_');
const words=t=>t.split(/\s+/).length;
function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}

/* ---------- render ---------- */
const el={};
function render(){
 const L=$('#list');L.innerHTML='';let page=undefined;const pages=[];
 ITEMS.forEach((it,i)=>{
  if(it.type==='endcue')return;
  const sc=it.type==='dir'&&it.text.match(/^(?:(ACT \d) — )?Scene (\d)\.(\d)(?: — ([A-Z]+))?/);
  if(sc){const nm=`Scene ${sc[2]}.${sc[3]}`+(sc[4]?' — '+sc[4][0]+sc[4].slice(1).toLowerCase():'');pages.push({i,act:+sc[2],label:nm,scene:1})}
  if(blkAt[i]&&blkAt[i].kind==='song')pages.push({i,label:'♪ '+(blkAt[i].name==='COSMIC CONFLICT 1'?'DOOR OF DOOM / EIGHT LONELY CAPTIVES':blkAt[i].name).split(' ').map(x=>x[0]+x.slice(1).toLowerCase()).join(' ')});
  const d=document.createElement('div');d.className='item '+it.type;d.dataset.i=i;el[i]=d;
  const b=blkAt[i];
  if(it.type==='cue'){
   if(b){d.className='blk';d.dataset.i=i;d.innerHTML=blockHTML(b)}
   else{const has=cueUrlSync(it.text);d.innerHTML=`<span class="cue">♪ ${it.text.toLowerCase()}</span>`}
  }else if(it.type==='dir'){d.innerHTML=`<div class="dir">${esc(it.text)}</div>`}
  else if(it.type==='gap'){d.innerHTML=`<div class="gap">… ${esc(it.text)}</div>`}
  else{
   const mine=isMine(it);if(mine)d.classList.add('mine');
   if(it.type==='lyric'&&!mine)d.classList.add('other');
   const w=it.who.map(n=>`<span>${n}</span>${muteBtn(n)}${eyeBtn(n)}`).join('<span>+</span>');
   if(it.who.some(hid))d.classList.add('blurred');
   d.innerHTML=`<div class="who">${it.type==='lyric'?'<span>♪</span>':''}${w}${it.paren?`<i>(${esc(it.paren)})</i>`:''}</div><div class="txt">${esc(it.text)}</div><div class="first">${esc(it.text.split(/\s+/).slice(0,3).join(' '))} …</div>${it.flag?`<div class="flag">⚠ check: ${esc(it.flag)}</div>`:''}<span class="t" data-t="${i}"></span>`;
  }
  L.appendChild(d);
 });
 CHAP=pages;let html='',act=0;
 pages.forEach(p=>{if(p.act&&p.act!==act){if(act)html+='</optgroup>';act=p.act;html+=`<optgroup label="Act ${act}">`}html+=`<option value="${p.i}">${p.scene?'':'\u00a0\u00a0\u00a0'}${esc(p.label)}</option>`});
 $('#chap').innerHTML=html+'</optgroup>';syncChap(activeI<0?0:activeI);
 BLOCKS.forEach(refreshTimes);
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function blockHTML(b){const v=verOf(b),nm=b.name==='COSMIC CONFLICT 1'?'COSMIC CONFLICT · EIGHT LONELY CAPTIVES':b.name.replace(/ (BED|INTRO)$/,'');
 const tog=b.demo&&b.hasK?`<div class="vt" role="group" aria-label="Track version"><button data-act="ver" data-v="karaoke" data-b="${b.name}" class="${v==='karaoke'?'on':''}">Karaoke</button><button data-act="ver" data-v="demo" data-b="${b.name}" class="${v==='demo'?'on':''}">Demo</button></div>`:(b.kind==='song'&&b.demo?'<span class="vt1">Demo</span>':'');
 return `<div class="bh"><button class="btitle" data-act="solo" data-b="${b.name}"><span class="bplay">▶</span><span><b>${esc(nm)}</b><small>${b.kind==='bed'?'music under the dialogue':fmt(b.dur)+' · tap to play'}</small></span></button>${tog}</div>`}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const bcfg=b=>{const s=store.blk[b.name]=store.blk[b.name]||{};if(s.start==null)s.start=0;if(s.ai==null)s.ai=true;s.t=s.t||{};s.tv=s.tv||{karaoke:s.t,demo:{}};return s};
const verOf=b=>{const c=bcfg(b);let v=c.ver||store.cfg.ver||'karaoke';if(v==='demo'&&!b.demo)v='karaoke';if(v==='karaoke'&&!b.hasK)v='demo';return v};
const fileOf=b=>verOf(b)==='demo'?'demo/'+b.demo:'music/'+b.file;

/* ---------- timings ---------- */
function defaults(b){const c=bcfg(b),ev=b.ev.filter(i=>ITEMS[i].type!=='dir'||true);
 const w=i=>{const it=ITEMS[i];if(it.type==='dir')return .4;if(it.type==='lyric')return .5+words(it.text)*.42;
  const a=AUD[i];return (a?a.dur:words(it.text)*.38)+.6};
 const tot=ev.reduce((s,i)=>s+w(i),0),span=Math.max(10,b.dur-c.start-6);let acc=0;const o={};
 ev.forEach(i=>{o[i]=c.start+1+acc/tot*span;acc+=w(i)});return o}
function getT(b,i){const c=bcfg(b),v=verOf(b),u=c.tv[v]||{};if(u[i]!=null)return u[i];const a=b.auto&&b.auto[v];if(a&&a[i]!=null)return a[i];return defaults(b)[i]}
function refreshTimes(b){b.ev.forEach(i=>{const s=document.querySelector(`[data-t="${i}"]`);if(!s)return;
  s.innerHTML=`<input class="tin" type="number" step="0.1" value="${getT(b,i).toFixed(1)}" data-act="t" data-b="${b.name}" data-i="${i}">`})}

/* ---------- audio / engine ----------
 Phones only allow sound to start inside a tap. So on the first tap we create one
 AudioContext (all voices play through it) and "unlock" three reusable <audio>
 elements for songs, background beds and sound effects. Later playback reuses them. */
let runId=0,paused=false,skipRes=null,tap=null,activeI=-1,running=false,curA=null,bed=null;
const vv=()=>+$('#vvol').value,mv=()=>+$('#mvol').value,rate=()=>+$('#rate').value;
let AC=null,VG=null;const liveSrc=new Set();
const mEl=new Audio(),bEl=new Audio(),sEl=new Audio();[mEl,bEl,sEl].forEach(e=>{e.preload='auto';e.playsInline=true});
const SILENT=(()=>{const n=800,b=new ArrayBuffer(44+n),d=new DataView(b);const w=(o,t)=>[...t].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,'data');d.setUint32(40,n,true);for(let i=0;i<n;i++)d.setUint8(44+i,128);
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))})();
function unlock(){
 try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();VG=AC.createGain();VG.connect(AC.destination)}
  if(AC.state!=='running'&&!paused)AC.resume()}catch(e){}
 [mEl,bEl,sEl].forEach(e=>{if(e._ok)return;e._ok=true;if(!e.src||e.paused){e.src=SILENT;const p=e.play();if(p)p.then(()=>{if(e.src===SILENT)e.pause()}).catch(()=>{e._ok=false})}})}
['pointerdown','touchend','keydown','click'].forEach(t=>document.addEventListener(t,unlock,{capture:true}));
function stopAll(){liveSrc.forEach(s=>{try{s.onended=null;s.stop()}catch(e){}s._done&&s._done()});liveSrc.clear();
 [mEl,bEl,sEl].forEach(e=>{e.pause()});clearInterval(fadeIv);curA=null;bed=null;if(skipRes){skipRes();skipRes=null}}
function sleep(ms,tok){return new Promise(res=>{let t=0;const iv=setInterval(()=>{if(tok!==runId){clearInterval(iv);res()}else if(!paused){t+=50;if(t>=ms){clearInterval(iv);res()}}},50);skipRes=()=>{clearInterval(iv);res()}})}
const PK={},DEC={};
function packBuf(n){return PK[n]=PK[n]||fetch('p/'+n).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).catch(()=>{delete PK[n];return null})}
function clipBuf(i){const m=AUD[i];if(!m||!m.pk||!AC)return Promise.resolve(null);if(DEC[i])return DEC[i];
 const[n,o,l]=m.pk;return DEC[i]=packBuf(n).then(b=>b?new Promise(r=>{try{const pr=AC.decodeAudioData(b.slice(o,o+l),r,()=>r(null));if(pr&&pr.catch)pr.catch(()=>r(null))}catch(e){r(null)}}):null).then(x=>{if(!x)delete DEC[i];return x})}
function prefetch(from){let k=0;for(let i=from;i<ITEMS.length&&k<4;i++)if(AUD[i]&&ITEMS[i].type==='line'){clipBuf(i);k++}}
function voice(i,tok){if(!AUD[i])return Promise.resolve();prefetch(i+1);
 return clipBuf(i).then(buf=>{if(!buf||(tok!=null&&tok!==runId))return;
  return new Promise(r=>{const s=AC.createBufferSource();s.buffer=buf;s.playbackRate.value=rate();VG.gain.value=vv();s.connect(VG);
   s._done=()=>{liveSrc.delete(s);r()};s.onended=s._done;liveSrc.add(s);try{s.start()}catch(e){s._done()}})})}
function playEl(e,url,vol,at){return new Promise(res=>{let done=false;const go=()=>{if(done)return;done=true;try{e.currentTime=at||0}catch(x){}e.volume=vol;const p=e.play();if(p)p.then(res).catch(res);else res()};
 e.pause();if(e.src.endsWith(url)&&e.readyState>0){go();return}e.src=url;e.addEventListener('loadedmetadata',go,{once:true});setTimeout(go,4000);e.load()})}
let CHAP=[];function syncChap(i){let v=CHAP.length?CHAP[0].i:'';for(const p of CHAP){if(p.i<=i)v=p.i;else break}const c=$('#chap');if(c&&String(c.value)!==String(v))c.value=v}
function setActive(i){syncChap(i);if(el[activeI])el[activeI].classList.remove('active','peek');activeI=i;const e=el[i];if(!e)return;e.classList.add('active');e.scrollIntoView({block:'center',behavior:'smooth'})}
async function run(from,evStart){
 const tok=++runId;stopAll();paused=false;if(AC&&AC.state!=='running')AC.resume();running=true;syncPlay();prefetch(from);
 for(let i=from;i<ITEMS.length&&tok===runId;i++){
  const it=ITEMS[i];
  if(it.type==='gap')continue;
  if(it.type==='endcue'){if(bed===it.text){bEl.pause();bed=null}continue}
  if(it.type==='cue'){
   const b=blkAt[i];if(evStart==null||!b||b.kind!=='song')setActive(i);else setActive(evStart);
   if(b&&b.kind==='song'){const v=verOf(b),pre=(b.pre&&b.pre[v])||[],post=(b.post&&b.post[v])||[];
    if(evStart!=null&&pre.includes(evStart)){for(const p of pre.filter(p=>p>=evStart)){if(tok!==runId)break;await playItem(p,tok)}evStart=undefined}
    else if(evStart==null)for(const p of pre){if(tok!==runId)break;await playItem(p,tok)}
    if(tok!==runId)break;
    if(!(evStart!=null&&post.includes(evStart)))await runBlock(b,tok,evStart);
    for(const p of post){if(tok!==runId)break;if(evStart!=null&&post.includes(evStart)&&p<evStart)continue;await playItem(p,tok)}
    evStart=undefined;i=b.last;continue}
   if(b&&b.kind==='bed'){const u=await cueUrl(b.name,b.file);if(u&&tok===runId){bed=b.name;playEl(bEl,u,mv()*.6)}await sleep(600,tok);continue}
   const u=await cueUrl(it.text);if(u&&tok===runId)playEl(sEl,u,mv())
   await sleep(900,tok);continue}
  await playItem(i,tok);
 }
 if(tok===runId){running=false;syncPlay();toast('End of the pages I have')}
}
async function playItem(i,tok){const it=ITEMS[i];setActive(i);
 if(it.type==='dir'){await sleep(1100,tok);return}
 if(it.type==='lyric'){await sleep((.5+words(it.text)*.42)*1000/$('#pace').value,tok);return}
 if(isMine(it)){if($('#auto').checked)await sleep((words(it.text)/2.6+1)*1000/$('#pace').value,tok);else await waitSkip(tok)}
 else{await voice(i,tok);if(tok===runId)await sleep(350,tok)}}
function waitSkip(tok){return new Promise(res=>{const iv=setInterval(()=>{if(tok!==runId){clearInterval(iv);res()}},100);skipRes=()=>{clearInterval(iv);res()}})}
async function runBlock(b,tok,evStart){
 const c=bcfg(b),url=userCue[b.name]||fileOf(b),demo=verOf(b)==='demo';
 if(!url){toast('No audio for '+b.name);return}
 const A=mEl;curA=A;clearInterval(fadeIv);A._tok=tok;
 const _v=verOf(b),_x=new Set([...((b.pre&&b.pre[_v])||[]),...((b.post&&b.post[_v])||[])]);const evs=b.ev.filter(i=>!_x.has(i));let k=0;
 if(evStart!=null)k=Math.max(0,evs.indexOf(evStart));
 await playEl(A,url,mv(),evStart!=null&&evs.length?Math.max(0,getT(b,evs[k])-.8):0);if(tok!==runId)return;
 let skipped=false;skipRes=()=>{skipped=true};
 const tailEnd=evs.length?getT(b,evs[evs.length-1])+4:1e9;
 return new Promise(res=>{
  const iv=setInterval(()=>{
   if(tok!==runId){clearInterval(iv);if(A._tok===tok)A.pause();res();return}
   if(paused)return;A.volume=mv();
   const ct=A.currentTime;
   if(tap){tap.A=A;}
   else while(k<evs.length&&getT(b,evs[k])<=ct){const i=evs[k++],it=ITEMS[i];if(getT(b,i)<ct-1.5&&k<evs.length&&getT(b,evs[k])<=ct)continue;setActive(i);if(it.type==='line'&&c.ai&&!isMine(it)&&!(demo&&b.auto&&(b.auto.sung||[]).includes(i)))voice(i,tok)}
   if(skipped||A.ended||(!tap&&k>=evs.length&&ct>tailEnd)||(tap&&tap.done)){skipRes=null;clearInterval(iv);fadeOut(A);if(tap){tap=null;$('#tapBtn').hidden=true}res()}
  },40)})}
let fadeIv=null;function fadeOut(A){clearInterval(fadeIv);const own=A._tok;let v=A.volume;fadeIv=setInterval(()=>{if(A._tok!==own){clearInterval(fadeIv);return}v-=.08;if(v<=0){clearInterval(fadeIv);A.pause()}else A.volume=v},60)}

/* ---------- tap-sync ---------- */
function startTap(b){
 const evs=b.ev.filter(i=>ITEMS[i].type!=='dir');
 tap={b,evs,k:0,A:null,done:false};$('#tapBtn').hidden=false;setActive(evs[0]);el[evs[0]].classList.add('next');
 toast('Tap the big button (or press Space) exactly when each highlighted line starts. Backspace undoes one.',6000);
 run(b.first)}
function stamp(){
 if(!tap||!tap.A)return;const {b,evs}=tap,c=bcfg(b),i=evs[tap.k];
 const T=c.tv[verOf(b)]=c.tv[verOf(b)]||{};T[i]=Math.max(0,tap.A.currentTime-.12);
 // directions sit just after the previous line
 b.ev.forEach((d,n)=>{if(ITEMS[d].type==='dir'){let p=b.ev[n-1];if(p!=null&&T[p]!=null&&ITEMS[p].type!=='dir')T[d]=T[p]+.05}});
 el[i].classList.remove('next');tap.k++;save();refreshTimes(b);
 if(tap.k>=evs.length){tap.done=true;$('#tapBtn').hidden=true;toast('Timings saved for '+b.name);return}
 const n=evs[tap.k];setActive(n);el[n].classList.add('next')}
function unstamp(){if(!tap||tap.k===0)return;const {b,evs}=tap;el[evs[tap.k]]?.classList.remove('next');tap.k--;delete (bcfg(b).tv[verOf(b)]||{})[evs[tap.k]];save();refreshTimes(b);setActive(evs[tap.k]);el[evs[tap.k]].classList.add('next')}

/* ---------- cue files (user-added sounds) ---------- */
let idb=null;
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('kc',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>{idb=q.result;r(idb)};q.onerror=()=>r(null)}catch(e){r(null)}})}
function idbGet(k){return new Promise(r=>{if(!idb)return r(null);try{const q=idb.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
function idbPut(k,v){return new Promise(r=>{if(!idb)return r(false);try{const q=idb.transaction('f','readwrite').objectStore('f').put(v,k);q.onsuccess=()=>r(true);q.onerror=()=>r(false)}catch(e){r(false)}})}
const userCue={};
async function cueUrl(name,file){
 if(userCue[name])return userCue[name];
 const f=file||slug(name)+'.mp3';if(KC.cueFiles.includes(f))return 'music/'+f;return null}
function cueUrlSync(name){return !!userCue[name]||KC.cueFiles.includes(slug(name)+'.mp3')}
const SFX=[...new Set(ITEMS.filter(i=>i.type==='cue'&&!BLOCKS.some(b=>b.name===i.text)).map(i=>i.text))];
function panel(){
 const p=$('#panel');
 p.innerHTML=`<b>Sound cues without a file yet</b> — pick an audio file for each (kept in this browser only):`+SFX.map(n=>`<div class="crow"><b>${n}</b>${cueUrlSync(n)?'✓ loaded':'—'} <input type="file" accept="audio/*" data-cue="${n}"></div>`).join('')+
 `<p style="color:var(--dim);font-size:14px">Keys: <kbd>Space</kbd> pause/resume (stamps a line in tap-sync) · <kbd>→</kbd> skip · <kbd>←</kbd> previous · <kbd>Esc</kbd> stop. Click any line to start from there.</p>`;
 p.querySelectorAll('[data-cue]').forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;userCue[inp.dataset.cue]=URL.createObjectURL(f);await idbPut(inp.dataset.cue,f);toast('Loaded '+f.name);panel();render()});}


/* ---------- UI wiring ---------- */
function syncPlay(){$('#bPlay').textContent=running?(paused?'▶ Resume':'⏸ Pause'):'▶ Play'}
function pauseToggle(){if(!running)return start(Math.max(activeI,0));paused=!paused;if(AC)paused?AC.suspend():AC.resume();if(curA)paused?curA.pause():curA.play().catch(()=>{});if(bed)paused?bEl.pause():bEl.play().catch(()=>{});if(paused)sEl.pause();syncPlay()}
function stopRun(){runId++;stopAll();running=false;paused=false;tap=null;$('#tapBtn').hidden=true;syncPlay()}
function start(i){const b=blkOf[i];if(b&&b.kind==='song'&&i!==b.first&&b.ev.includes(i))run(b.first,i);else if(b&&b.kind==='song'&&i!==b.first)run(b.first);else run(i)}
function step(d){let cur=activeI<0?0:activeI,nxt=cur+d;
 while(nxt>0&&nxt<ITEMS.length-1&&(ITEMS[nxt].type==='endcue'||ITEMS[nxt].type==='gap'))nxt+=d;
 nxt=Math.min(Math.max(nxt,0),ITEMS.length-1);
 const b=blkOf[cur];if(d>0&&running&&skipRes&&!(b&&b.kind==='song'))return skipRes();start(nxt)}
$('#bPlay').onclick=pauseToggle;$('#bStop').onclick=stopRun;$('#bNext').onclick=()=>step(1);$('#bPrev').onclick=()=>step(-1);
const openDrawer=v=>{$('#drawer').hidden=!v};$('#bMenu').onclick=()=>openDrawer(true);$('#bClose').onclick=()=>openDrawer(false);
$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')openDrawer(false)});
$('#tapBtn').addEventListener('click',e=>{e.stopPropagation();stamp()});
$('#bSet').onclick=()=>{const p=$('#panel');p.classList.toggle('open');if(p.classList.contains('open'))panel()};
$('#chap').onchange=e=>{const v=+e.target.value;if(running)stopRun();if(el[activeI])el[activeI].classList.remove('active');activeI=v;el[v]&&el[v].scrollIntoView({block:'start'})};
$('#mem').onchange=e=>{document.body.classList.remove('mem-first','mem-hide');if(e.target.value!=='show')document.body.classList.add('mem-'+e.target.value);store.cfg.mem=e.target.value;save()};

['auto','pace','vvol','mvol','rate','ver'].forEach(id=>{const e=$('#'+id);const v=store.cfg[id];if(v!=null){if(e.type==='checkbox')e.checked=v;else e.value=v}e.addEventListener('input',()=>{store.cfg[id]=e.type==='checkbox'?e.checked:e.value;save();if(id==='ver'){BLOCKS.forEach(refreshTimes);toast('Songs now use the '+(e.value==='demo'?'demo':'karaoke')+' version')}})});
if(store.cfg.mem){$('#mem').value=store.cfg.mem;$('#mem').onchange({target:$('#mem')})}
$('#list').addEventListener('click',e=>{
 const eb=e.target.closest('[data-eye]');
 if(eb){e.stopPropagation();const w=eb.dataset.eye;store.cfg.hide[w]=!hid(w);save();const keep=activeI;const row=+eb.closest('[data-i]').dataset.i;const y=eb.getBoundingClientRect().top;render();
  if(keep>=0&&el[keep])el[keep].classList.add('active');const nb=el[row]&&el[row].querySelector('[data-eye]');if(nb)window.scrollBy(0,nb.getBoundingClientRect().top-y);
  toast(hid(w)?w+"'s lines are blurred. Tap a line to peek.":w+"'s lines are visible again.");return}
 const mb=e.target.closest('.mute');
 if(mb){e.stopPropagation();const w=mb.dataset.w;store.cfg.cast[w]=!castOn(w);save();const keep=activeI;const row=+mb.closest('[data-i]').dataset.i;const y=mb.getBoundingClientRect().top;render();
  if(keep>=0&&el[keep])el[keep].classList.add('active');const nb=el[row]&&el[row].querySelector('.mute');if(nb)window.scrollBy(0,nb.getBoundingClientRect().top-y);
  toast(castOn(w)?w+' unmuted. The app reads '+w+'.':w+' muted. You\'re rehearsing '+w+'.');return}
 const a=e.target.closest('[data-act]');
 if(a){const b=BLOCKS.find(x=>x.name===a.dataset.b),act=a.dataset.act,c=b&&bcfg(b);
  if(act==='solo'){start(b.first)}
  else if(act==='tap'){startTap(b)}
  else if(act==='reset'){c.tv[verOf(b)]={};if(verOf(b)==='karaoke')c.t=c.tv.karaoke;save();refreshTimes(b);toast('Your taps cleared. Using the automatic timings.')}
  else if(act==='ver'){c.ver=a.dataset.v;save();const box=el[b.first];if(box)box.innerHTML=blockHTML(b);if(running&&blkOf[activeI]===b){const at=activeI;if(!paused)start(at);else{stopRun();activeI=at;el[at]&&el[at].classList.add('active')}}}
  else if(act==='start'){}
  return}
 const it=e.target.closest('.item');if(!it)return;const i=+it.dataset.i;
 if(tap){stamp();return}
 if(((it.classList.contains('mine')&&document.body.classList.contains('mem-hide'))||it.classList.contains('blurred'))&&!it.classList.contains('peek')){it.classList.add('peek');return}
 start(i)});
$('#list').addEventListener('change',e=>{const a=e.target;if(!a.dataset.act)return;const b=BLOCKS.find(x=>x.name===a.dataset.b),c=bcfg(b);
 if(a.dataset.act==='start'){c.start=+a.value||0;save();refreshTimes(b)}
 else if(a.dataset.act==='t'){c.t[a.dataset.i]=+a.value;save()}
 else if(a.dataset.act==='ai'){c.ai=a.checked;save()}
 else if(a.dataset.act==='ver'){c.ver=a.value||undefined;save();refreshTimes(b);toast(b.name+': '+verOf(b))}});
document.addEventListener('keydown',e=>{
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.key!=='Escape')return;
 if(e.key==='Escape'&&!$('#drawer').hidden){openDrawer(false);return}
 if(tap&&(e.key===' '||e.key==='Enter'||e.key==='t')){e.preventDefault();stamp();return}
 if(tap&&e.key==='Backspace'){e.preventDefault();unstamp();return}
 if(e.key===' '){e.preventDefault();pauseToggle()}
 else if(e.key==='ArrowRight'){e.preventDefault();step(1)}
 else if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}
 else if(e.key==='Escape')stopRun()});
let scT=0;addEventListener('scroll',()=>{if(running)return;clearTimeout(scT);scT=setTimeout(()=>{const y=$('#bar').getBoundingClientRect().bottom+8;let best=0;for(const p of CHAP){const e=el[p.i];if(e&&e.getBoundingClientRect().top<=y)best=p.i;else if(e)break}const c=$('#chap');if(c)c.value=best},120)},{passive:true});
castUI();render();openDB().then(async()=>{if(!idb)return;for(const n of SFX){const f=await idbGet(n);if(f)userCue[n]=URL.createObjectURL(f)}render()});
</script></body></html>
